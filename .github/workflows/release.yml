name: Build & Release Setup

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use Properties/AssemblyInfo.cs)'
        required: false
        default: ''
      create_release:
        description: 'Publish a GitHub Release with the installer'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  package:
    name: Build Windows Setup (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.version }}")) {
            $ver = "${{ inputs.version }}".TrimStart('v')
          } else {
            $asm = Get-Content "Properties/AssemblyInfo.cs" -Raw
            if ($asm -match 'public const string Current = "([^"]+)"') {
              $ver = $Matches[1]
            } else {
              throw "Could not parse AppVersion.Current from Properties/AssemblyInfo.cs"
            }
          }
          Write-Host "Resolved version: $ver"
          "value=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild Bins.csproj /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }

      - name: Compile Inno Setup installer
        id: installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe).Source
          }

          & $iscc "/DMyAppVersion=$ver" "installer\Bins.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setupPath = "dist\Bins-Setup-$ver-x64.exe"
          if (-not (Test-Path $setupPath)) {
            throw "Expected installer not found at $setupPath"
          }

          $portablePath = "dist\Bins-Portable-$ver-x64.zip"
          if (Test-Path $portablePath) { Remove-Item -Force $portablePath }
          Compress-Archive -Path @("bin\Release\Bins.exe", "app.ico", "README.md") -DestinationPath $portablePath -CompressionLevel Optimal

          $sha = (Get-FileHash -Path $setupPath -Algorithm SHA256).Hash
          $portableSha = (Get-FileHash -Path $portablePath -Algorithm SHA256).Hash
          @(
            "$sha  Bins-Setup-$ver-x64.exe"
            "$portableSha  Bins-Portable-$ver-x64.zip"
          ) | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii

          # Generate release-ready WinGet manifest with real URL and SHA256
          $manifest = Get-Content "installer\winget\PiyushAgade.Bins.yaml" -Raw
          $manifest = $manifest -replace '(?m)^PackageVersion:\s*.*$', "PackageVersion: $ver"
          $manifest = $manifest -replace '(?m)^(\s*InstallerUrl:\s*).*$', "`${1}https://github.com/${{ github.repository }}/releases/download/v$ver/Bins-Setup-$ver-x64.exe"
          $manifest = $manifest -replace '(?m)^(\s*InstallerSha256:\s*).*$', "`${1}$sha"
          $manifest | Set-Content -Path "dist\PiyushAgade.Bins.yaml" -Encoding utf8

          Write-Host "Built $setupPath (SHA256: $sha)"
          Write-Host "Built $portablePath (SHA256: $portableSha)"
          "setup_path=$setupPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "portable_path=$portablePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "portable_sha256=$portableSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Scan release assets with VirusTotal
        id: virustotal
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $targets = @(
            @{ Path = "${{ steps.installer.outputs.portable_path }}"; Sha = "${{ steps.installer.outputs.portable_sha256 }}" },
            @{ Path = "${{ steps.installer.outputs.setup_path }}";    Sha = "${{ steps.installer.outputs.sha256 }}" }
          )

          if ([string]::IsNullOrWhiteSpace($env:VT_API_KEY)) {
            Write-Warning "VIRUSTOTAL_API_KEY secret is not configured; skipping VirusTotal scan."
            "has_results=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "report_url=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $headers = @{ "x-apikey" = $env:VT_API_KEY }
          $scans = @()

          foreach ($t in $targets) {
            $fileItem = Get-Item -Path $t.Path
            $fileName = $fileItem.Name
            $shaLower = $t.Sha.ToLowerInvariant()
            $reportUrl = "https://www.virustotal.com/gui/file/$shaLower"

            if ($fileItem.Length -gt 32MB) {
              $uploadUrlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $headers -Method Get
              $uploadUrl = $uploadUrlResp.data
            } else {
              $uploadUrl = "https://www.virustotal.com/api/v3/files"
            }

            Write-Host "Uploading $fileName ($([math]::Round($fileItem.Length / 1MB, 2)) MB) to VirusTotal..."
            $uploadResp = Invoke-RestMethod -Uri $uploadUrl -Headers $headers -Method Post -Form @{ file = $fileItem }
            $analysisId = $uploadResp.data.id
            if (-not $analysisId) {
              throw "VirusTotal upload did not return an analysis ID for $fileName."
            }

            $scans += @{
              FileName   = $fileName
              ShaLower   = $shaLower
              ReportUrl  = $reportUrl
              AnalysisId = $analysisId
              Status     = "queued"
              Stats      = $null
            }
            Start-Sleep -Seconds 5
          }

          Write-Host "Polling VirusTotal analyses for completion..."
          $maxAttempts = 18
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Start-Sleep -Seconds 20
            $pending = 0
            foreach ($s in $scans) {
              if ($s.Status -eq "completed") { continue }
              $analysisResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$($s.AnalysisId)" -Headers $headers -Method Get
              $s.Status = $analysisResp.data.attributes.status
              Write-Host "Attempt $i/$maxAttempts - $($s.FileName): $($s.Status)"
              if ($s.Status -eq "completed") {
                $s.Stats = $analysisResp.data.attributes.stats
              } else {
                $pending++
              }
            }
            if ($pending -eq 0) { break }
          }

          $tableLines = @(
            "### VirusTotal Scans"
            ""
            "| File | SHA-256 | Result | Report |"
            "| --- | --- | --- | --- |"
          )

          $setupBadgeMsg = "Scanned"
          $setupBadgeColor = "10B981"
          $primaryReportUrl = ""

          foreach ($s in $scans) {
            if ($s.Status -eq "completed" -and $s.Stats) {
              $malicious = [int]$s.Stats.malicious
              $suspicious = [int]$s.Stats.suspicious
              $undetected = [int]$s.Stats.undetected
              $harmless = [int]$s.Stats.harmless
              $total = $malicious + $suspicious + $undetected + $harmless
              $resultText = "$malicious / $total detections"
              if ($malicious -gt 0) {
                Write-Warning "$($s.FileName): VirusTotal reported $malicious malicious detection(s). Report: $($s.ReportUrl)"
              }
              if ($s.FileName -like "Bins-Setup-*") {
                $setupBadgeMsg = if ($malicious -eq 0) { "0/$total clean" } else { "$malicious/$total detections" }
                $setupBadgeColor = if ($malicious -eq 0) { "10B981" } else { "F59E0B" }
              }
            } else {
              $resultText = "In progress ($($s.Status))"
            }

            $primaryReportUrl = $s.ReportUrl
            $tableLines += "| ``$($s.FileName)`` | ``$($s.ShaLower)`` | $resultText | [View Report]($($s.ReportUrl)) |"
          }

          $tableLines | Set-Content -Path "dist\virustotal-table.md" -Encoding utf8
          $tableLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          @{
            schemaVersion = 1
            label         = "VirusTotal"
            message       = $setupBadgeMsg
            color         = $setupBadgeColor
          } | ConvertTo-Json -Compress | Set-Content -Path "dist\virustotal-badge.json" -Encoding utf8

          "has_results=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "report_url=$primaryReportUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bins-Setup-${{ steps.version.outputs.value }}-x64
          path: |
            dist/Bins-Setup-${{ steps.version.outputs.value }}-x64.exe
            dist/Bins-Portable-${{ steps.version.outputs.value }}-x64.zip
            dist/SHA256SUMS.txt
            dist/PiyushAgade.Bins.yaml
            dist/virustotal-badge.json
          if-no-files-found: error

      - name: Build release notes
        id: release_notes
        if: github.ref_type == 'tag' || inputs.create_release == true
        shell: pwsh
        run: |
          if (Test-Path "dist\virustotal-table.md") {
            Copy-Item -Force "dist\virustotal-table.md" "dist\release-notes.md"
          } else {
            $ver = "${{ steps.version.outputs.value }}"
            $sha = "${{ steps.installer.outputs.sha256 }}".ToLowerInvariant()
            $portableSha = "${{ steps.installer.outputs.portable_sha256 }}".ToLowerInvariant()
            @(
              "### Verification"
              ""
              "| File | SHA-256 |"
              "| --- | --- |"
              "| ``Bins-Portable-$ver-x64.zip`` | ``$portableSha`` |"
              "| ``Bins-Setup-$ver-x64.exe`` | ``$sha`` |"
            ) | Set-Content -Path "dist\release-notes.md" -Encoding utf8
          }

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Bins ${{ steps.version.outputs.tag }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          files: |
            dist/Bins-Setup-${{ steps.version.outputs.value }}-x64.exe
            dist/Bins-Portable-${{ steps.version.outputs.value }}-x64.zip
            dist/SHA256SUMS.txt
            dist/PiyushAgade.Bins.yaml
            dist/virustotal-badge.json

      - name: Ensure release body includes latest Verification & VirusTotal
        if: github.ref_type == 'tag' || inputs.create_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $vtUrl = "${{ steps.virustotal.outputs.report_url }}"
          if ([string]::IsNullOrWhiteSpace($vtUrl)) { exit 0 }

          $currentBody = ((gh release view $tag --json body --jq .body) -join "`n")
          if (($currentBody -notmatch '### VirusTotal Scans') -or ($currentBody -notmatch [regex]::Escape($vtUrl))) {
            $newHeader = (Get-Content "dist\release-notes.md" -Raw).Trim()
            $changelog = ""
            if ($currentBody -match '(?s)(\*\*Full Changelog\*\*.*)') {
              $changelog = "`n`n" + $Matches[1].Trim()
            }
            $merged = $newHeader + $changelog
            $merged | Set-Content -Path "dist\release-notes-final.md" -Encoding utf8
            gh release edit $tag --notes-file "dist\release-notes-final.md"
          }
